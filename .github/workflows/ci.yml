name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOWORK: "off"
  CGO_ENABLED: "0"

jobs:
  test:
    name: Build + test + exact 100% coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # ⛔ 1.27.4 BECAUSE INSTALLING A FLEET TOOL REQUIRES IT. fleettools
          # declares `go >= 1.27.4`, so 1.27.3 could not install aptneed at
          # all: "requires go >= 1.27.4 (running go 1.27.3;
          # GOTOOLCHAIN=local)". GOTOOLCHAIN is left alone on purpose — a
          # runner that silently fetched a newer toolchain would measure one
          # nobody chose — so the pin is what has to move.
          #
          # ⛔ SECOND OCCURRENCE IN TWO DAYS: go-pdfkit/ops hit the identical
          # line on 2026-11-13. Any repository in this fleet pinning below
          # 1.27.4 fails the moment it installs a fleettools command, and the
          # failure names both versions, so it is at least legible.
          go-version: '1.27.4'
          check-latest: true
          cache: true

      # ⛔⛔ THE FOREIGN JUDGE HAD NEVER RUN ON ANY LANE. Measured on run
      # 43595391186: "qpdf" appears ZERO times in the whole log, and this job
      # reported `ok 0.197s` where the same suite takes 0.758s on a machine
      # that has qpdf. Every test that agrees with qpdf — the sweep over 42
      # generated files, and the control that an ordinary file is REFUSED —
      # skipped, and `go test` without -v says nothing about a skip, so
      # nothing in the log could have told anyone. Coverage stayed at 100%
      # the whole time: the same statements are reached by the tests that
      # need no qpdf, so that gate cannot see this and never could.
      #
      # ⛔ This repository already holds the opposite standard one job down,
      # about a missing qemu emulator: "A lane that reports success for an
      # architecture it never ran is the one outcome this matrix exists to
      # rule out."
      #
      # ⛔⛔ QPDF 12 AND NOT THE DISTRIBUTION'S 11.9.0, WHICH WAS MEASURED
      # RATHER THAN PREFERRED. `--show-linearization` prints its "Computed
      # Linearization Part Assignments" section only from qpdf 12 onwards, and
      # that section IS the foreign judge the partition test compares against.
      # On ubuntu's 11.9.0 it is absent: the test refused to compare against
      # nothing — correctly, and the whole CI run went red to say so.
      #
      # ⛔ It is also the version measured against locally. A judge that
      # differs between the terminal and CI is two judges, and the one that
      # matters is whichever happens to be red.
      #
      # ⛔ THE DIGEST IS PINNED AS A LITERAL, not fetched: a checksum file
      # served from the same release is only as trustworthy as the release, so
      # what guards the download from here on is this recorded value, and a
      # version bump needs a new one deliberately.
      #
      # ⛔⛔ AND HERE IS EXACTLY WHAT WAS AND WAS NOT VERIFIED, because "verified
      # by hand" overstates it. On 2026-11-15 the zip was downloaded and its
      # SHA-256 computed locally as
      # db367d897829f22c4198ce1094143c9d467bd6ee7dfabc44ba6f02056b24f8b1, which
      # matched the qpdf-12.4.2.sha256 published in the SAME release. That
      # establishes the download was not corrupted in transit. It does NOT
      # establish that the release is authentic — both came from one channel.
      # The release also ships qpdf-12.4.2.sha256.sigstore and a .tar.gz.asc,
      # which would be the independent channel and were NOT checked. Trust
      # here is first-use, pinned; saying so is the point.
      - name: Install qpdf 12, the foreign judge the linearization tests print by
        env:
          QPDF_VERSION: "12.4.2"
          QPDF_SHA256: "db367d897829f22c4198ce1094143c9d467bd6ee7dfabc44ba6f02056b24f8b1"
        run: |
          zip="qpdf-${QPDF_VERSION}-bin-linux-x86_64.zip"
          curl -fsSL --retry 3 -O "https://github.com/qpdf/qpdf/releases/download/v${QPDF_VERSION}/${zip}"
          printf '%s  %s\n' "$QPDF_SHA256" "$zip" | sha256sum -c -
          sudo unzip -q -o "$zip" -d /opt/qpdf
          echo "/opt/qpdf/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=/opt/qpdf/lib" >> "$GITHUB_ENV"

      # Printed on purpose: the version is in the log, so "which qpdf agreed"
      # is answerable after the fact rather than assumed. It is also how the
      # 11.9.0 finding above was diagnosed at all.
      - name: Say which qpdf will judge
        run: qpdf --version

      # poppler's pdfsig is the judge for signature verdicts: reader/signature
      # must agree with it on every committed fixture and every tampering of
      # one. Printed, so "which pdfsig agreed" is answerable from the log.
      - name: Install pdfsig (poppler-utils), the judge of signature verdicts
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pdfsig -v

      - name: go vet
        run: go vet ./...

      # REQUIRE_QPDF and PDFSIG_REQUIRE make a missing judge FAIL here instead
      # of skipping. They are set on this lane only, because this is the lane
      # that installs the judges.
      - name: Test with coverage
        env:
          REQUIRE_QPDF: "1"
          PDFSIG_REQUIRE: "1"
        run: go test -covermode=set -coverprofile=coverage.out ./...

      - name: Assert exact 100% statement coverage
        run: |
          go tool cover -func=coverage.out | tail -n +1 > /tmp/cov.txt
          below=$(go tool cover -func=coverage.out | awk '$3 != "100.0%"')
          if [ -n "$below" ]; then
            echo "::error::coverage below 100%"
            echo "$below"
            exit 1
          fi
          echo "all statements covered (100.0%)"

      - name: Cross-compile (6 64-bit arches + wasm + darwin + windows)
        run: |
          for arch in amd64 arm64 riscv64 loong64 ppc64le s390x; do
            echo "== linux/$arch =="
            GOOS=linux GOARCH=$arch go build ./...
          done
          GOOS=js      GOARCH=wasm  go build ./...
          GOOS=darwin  GOARCH=arm64 go build ./...
          GOOS=windows GOARCH=amd64 go build ./...

  # Cross-compiling proves the code COMPILES for an architecture; it does not
  # prove it computes the right answer there. This package reads a PDF: xref
  # offsets, stream lengths and object numbers, all of them numbers taken out of
  # a file and held in an int.
  #
  # s390x is BIG-ENDIAN and 386/arm are 32-bit, so between them these lanes
  # cover both assumptions a byte-stream reader can carry without knowing it.
  # poppler and pdfium test on none of the four 64-bit arches; 32-bit ARM they
  # do hold, and we did not.
  arch-qemu:
    name: arch ${{ matrix.goarch }} (${{ matrix.via }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: riscv64, exec: "-exec=qemu-riscv64-static", via: qemu }
          - { goarch: loong64, exec: "-exec=qemu-loongarch64-static", via: qemu }
          - { goarch: ppc64le, exec: "-exec=qemu-ppc64le-static", via: qemu }
          - { goarch: s390x,   exec: "-exec=qemu-s390x-static", via: qemu }
          # 386 runs with NO emulator: a 386 ELF executes directly on the
          # x86-64 runner. That is not a convenience, it is a correctness
          # requirement. Measured on one commit of go-gfx/gfx, eight identical
          # lanes each:
          #
          #   under qemu-i386                    5 failures out of 8
          #   under qemu-i386, asyncpreemptoff=1 0 out of 8
          #   native on the same runner          0 out of 8
          #   under qemu-arm                     0 out of 8
          #
          # Each failure landed on a DIFFERENT input although the seed is
          # fixed, and the wrong value was a sign flip rather than a rounding
          # difference. qemu-i386 loses the guest's floating-point state across
          # the signal Go delivers for asynchronous preemption. Emulating 386
          # here would buy nothing and cost a lane that goes red at random.
          - { goarch: "386",   exec: "", via: native }
          - { goarch: arm,     exec: "-exec=qemu-arm-static", via: qemu }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      # ⛔ `qemu-user-static` is a VIRTUAL package on Ubuntu 26.04, which
      # `ubuntu-latest` became on 2026-10-19, and apt refuses to choose between its
      # two providers:
      #
      #   E: Package 'qemu-user-static' has no installation candidate
      #
      # ⚠ Installing a provider is NOT the fix: `qemu-user-binfmt` registers binfmt
      # handlers, it does not ship the `qemu-<arch>-static` binaries this lane
      # invokes. `qemu-user` ships the dynamic `qemu-<arch>`, which is all that
      # `go test -exec` needs, so both are installed and BOTH NAMES are accepted
      # below. go-tex/engine#645 has the full account.
      - name: install qemu user-mode emulators
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y qemu-user qemu-user-binfmt
      - name: Test under qemu (${{ matrix.goarch }})
        run: |
          flag="${{ matrix.exec }}"
          ex=""
          if [ -n "$flag" ]; then
            base="${flag#-exec=}"
            q=""
            for cand in "$base" "${base%-static}"; do
              command -v "$cand" >/dev/null 2>&1 && q="$cand" && break
            done
            # ⛔ A missing emulator FAILS this lane. A lane that reports success
            # for an architecture it never ran is the one outcome this matrix
            # exists to rule out.
            if [ -z "$q" ]; then
              echo "::error::no qemu user emulator for ${{ matrix.goarch }} (looked for $base and ${base%-static})"
              exit 1
            fi
            ex="-exec=$q"
            # Printed on purpose: without it, "ran under emulation" and
            # "skipped" are indistinguishable from a green tick.
            echo "running ${{ matrix.goarch }} under $q"
          else
            # ⚠ An EMPTY exec is a lane that runs NATIVELY on purpose: a 386
            # ELF executes directly on the x86-64 runner, and qemu-i386 was
            # measured to lose the guest's floating-point state across the
            # signal Go delivers for preemption. Failing it for having no
            # emulator would break a lane that is correct as it stands.
            echo "running ${{ matrix.goarch }} natively"
          fi
          GOARCH=${{ matrix.goarch }} go test $ex ./...

  # Cross-compiling for darwin and windows is not running there. poppler and
  # pdfium are tested on both, so this is not new ground -- it is ground the
  # references hold and this repository did not: path handling, line endings and
  # file semantics are where a Linux-only suite is quietly incomplete.
  #
  # The coverage gate stays on ubuntu; these two lanes only run the tests.
  os-matrix:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - run: go test ./...
